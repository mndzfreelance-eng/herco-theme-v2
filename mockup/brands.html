<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herco v1.4.0 — Brands Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="css/mockup.css">
</head>
<body class="mockup-preview">

<p class="mockup-note"><strong>v1.4.0</strong> — matches <code>page-brands.php</code> / <code>archive-brand.php</code>. Replaces old Impreza shortcodes at <code>/brands/</code>.</p>

<section class="section">
  <div class="section-inner">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/">Home</a><span class="breadcrumb-sep">›</span><span>Brands</span>
    </nav>
    <header class="section-hd">
      <p class="section-label">Brand Portfolio</p>
      <h1 class="section-heading" data-herco="brands-title">Our Principals</h1>
      <p class="section-sub" data-herco="brands-intro"></p>
    </header>
    <div class="filter-chips" id="brandFilters">
      <button type="button" class="chip active" data-cat="all">All Brands</button>
      <button type="button" class="chip" data-cat="power-tools">Power Tools</button>
      <button type="button" class="chip" data-cat="hardware">Hardware</button>
    </div>
    <div class="brands-grid" id="brandsGrid" data-herco="brands-grid"></div>
  </div>
</section>

<script src="js/site-content.js"></script>
<script src="js/render-theme.js"></script>
<script>
(function () {
  function renderBrandsPage() {
    var site = window.HERCO_SITE || {};
    var page = site.brandsPage || {};
    var title = document.querySelector('[data-herco="brands-title"]');
    var intro = document.querySelector('[data-herco="brands-intro"]');
    var grid = document.querySelector('[data-herco="brands-grid"]');
    if (title && page.title) title.textContent = page.title;
    if (intro && page.intro) intro.textContent = page.intro;
    if (grid && site.brandsFallback) {
      grid.innerHTML = site.brandsFallback.map(function (name) {
        return '<div class="brand-tile brand-tile--fallback" data-cats="all"><span class="brand-tile-name">' + name + '</span></div>';
      }).join('');
    }
    document.querySelectorAll('#brandFilters .chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#brandFilters .chip').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    });
  }
  renderBrandsPage();
  document.addEventListener('herco:content-ready', renderBrandsPage);
})();
</script>
</body>
</html>
