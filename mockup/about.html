<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herco — About (matches WP theme)</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="css/mockup.css">
</head>
<body class="mockup-preview">

<p class="mockup-note">Matches <strong>page-about.php</strong> / <strong>template-about.php</strong>. Same copy as WordPress — loaded from <code>content/site-content.json</code>.</p>

<section class="section">
  <div class="section-inner">
    <header class="section-hd">
      <p class="section-label">Our Story</p>
      <h1 class="section-heading">About Herco Trading</h1>
    </header>
    <header class="section-hd section-hd--left" style="margin-top:8px;margin-bottom:20px">
      <h2 class="section-heading" style="font-size:28px">Who We Are</h2>
    </header>
    <div class="about-grid">
      <div class="about-body" data-herco="about-body"></div>
      <div class="about-visual is-placeholder" data-herco-slot="about">
        <img src="../assets/images/placeholders/about.svg" data-img="about" alt="About Herco Trading" class="herco-img about-visual__img herco-img--placeholder">
      </div>
    </div>
    <div class="about-mv" data-herco="about-mv"></div>
    <header class="section-hd" style="margin-top:48px">
      <p class="section-label">Affiliates</p>
      <h2 class="section-heading" style="font-size:28px">Strategic Partners</h2>
    </header>
    <div class="affiliates-row" data-herco="affiliates-row"></div>
  </div>
</section>

<script src="js/site-content.js"></script>
<script src="js/render-theme.js"></script>
<script src="js/images.js"></script>
</body>
</html>
