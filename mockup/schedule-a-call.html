<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herco v1.4.0 — Schedule a Call</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="css/mockup.css">
</head>
<body class="mockup-preview">

<p class="mockup-note"><strong>v1.4.0</strong> — matches <code>page-schedule-a-call.php</code></p>

<section class="section">
  <div class="section-inner">
    <nav class="breadcrumb"><a href="/">Home</a><span class="breadcrumb-sep">›</span><span>Schedule a Call</span></nav>
    <div class="herco-form-wrap">
      <p class="section-label" style="margin-bottom:8px">Consultation</p>
      <h1 class="section-heading" style="font-size:32px;margin-bottom:12px">Schedule a Call</h1>
      <p class="herco-form-desc" data-herco="form-intro"></p>
      <form class="herco-form wpcf7-form">
        <div class="form-row">
          <div><label class="field-label">Full Name *</label><input type="text"></div>
          <div><label class="field-label">Company</label><input type="text"></div>
        </div>
        <div class="form-row">
          <div><label class="field-label">Email *</label><input type="email"></div>
          <div><label class="field-label">Phone</label><input type="tel"></div>
        </div>
        <div class="form-row">
          <div><label class="field-label">Preferred Date</label><input type="date"></div>
          <div><label class="field-label">Preferred Time</label><input type="time"></div>
        </div>
        <div class="form-row full">
          <div><label class="field-label">Message *</label><textarea rows="6">I would like to schedule a call to discuss…</textarea></div>
        </div>
        <p><input type="submit" value="Request a Call"></p>
      </form>
    </div>
  </div>
</section>

<script src="js/site-content.js"></script>
<script>
(function () {
  function setIntro() {
    var page = (window.HERCO_SITE || {}).formPages;
    var el = document.querySelector('[data-herco="form-intro"]');
    if (el && page && page['schedule-a-call']) el.textContent = page['schedule-a-call'].intro;
  }
  setIntro();
  document.addEventListener('herco:content-ready', setIntro);
})();
</script>
</body>
</html>
