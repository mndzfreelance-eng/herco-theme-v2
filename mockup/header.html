<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herco — Header (matches WP theme)</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="css/mockup.css">
</head>
<body class="mockup-preview">

<p class="mockup-note">Matches <strong>header.php</strong> in the WordPress theme. Logo: <strong>Appearance → Customize → Site Identity</strong>, or drop <code>assets/images/logo.png</code> here to preview.</p>

<div id="hercoLoader" class="page-loader" aria-hidden="true" role="status">
  <div class="page-loader__inner">
    <div class="page-loader__wordmark site-logo-fallback" data-logo-fallback>HERCO<span>.</span></div>
    <div class="page-loader__track"><span></span></div>
  </div>
</div>

<div class="topbar">
  <span class="topbar__tag">Serving the Philippines since 1908</span>
  <div class="topbar__links">
    <a href="mailto:info@herco.com.ph">info@herco.com.ph</a>
    <span class="topbar__sep" aria-hidden="true"></span>
    <a href="tel:+63288187736">(02) 8818-7736</a>
  </div>
</div>

<header class="site-header">
  <a href="/" class="site-logo" data-herco-slot="logo">
    <span class="site-logo-fallback" data-logo-fallback>HERCO<span>.</span></span>
    <img src="../assets/images/placeholders/brand-logo.svg" data-img="logo" alt="Herco logo" class="site-logo__img herco-img--placeholder" hidden>
  </a>

  <nav class="main-navigation" aria-label="Primary">
    <a href="/">Home</a>
    <a href="/brands/">Brands</a>
    <a href="/about/">About</a>
    <a href="/faq/">Support</a>
  </nav>

  <div class="nav-cta">
    <a href="/request-quote/" class="btn btn--outline btn--sm">Request Quote</a>
    <a href="/schedule-a-call/" class="btn btn--primary btn--sm">Schedule a Call</a>
  </div>

  <button class="nav-toggle" id="navToggle" aria-label="Open menu"></button>
</header>

<script src="js/icons.js"></script>
<script src="js/images.js"></script>
<script>
(function () {
  var toggle = document.getElementById('navToggle');
  if (toggle && window.hercoIcon) toggle.innerHTML = hercoIcon('menu');
  document.querySelectorAll('img[data-img="logo"]').forEach(function (img) {
    img.addEventListener('load', function () {
      if (!img.classList.contains('herco-img--placeholder')) {
        document.querySelectorAll('[data-logo-fallback]').forEach(function (el) { el.hidden = true; });
        img.hidden = false;
      }
    });
  });
})();
</script>
<script src="../js/main.js"></script>
</body>
</html>
